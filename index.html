<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Crossy Road 3D</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="top-bar">
    <div id="score-board">0</div>
    <div class="top-actions">
      <button class="icon-btn" id="pause-top-btn" title="Pause">⏸</button>
      <button class="icon-btn" id="settings-top-btn" title="Settings">⚙️</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <!-- All menus, modals & changelogs get injected here dynamically -->
  <div id="ui-root"></div>

  <!-- Controls Container -->
  <div id="controls-container" class="layout-split">
    <div class="control-group group-vertical">
      <button class="btn btn-tall" id="btn-up">▲</button>
      <button class="btn btn-tall" id="btn-down">▼</button>
    </div>
    <div class="control-group group-horizontal">
      <button class="btn btn-wide" id="btn-left">◀</button>
      <button class="btn btn-wide" id="btn-right">▶</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>

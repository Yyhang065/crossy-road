<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Crossy Road</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
    body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    #score-board {
      position: absolute; top: 20px; left: 24px; color: white;
      font-size: 38px; font-weight: 900; text-shadow: 2px 2px 0px rgba(0,0,0,0.4);
      z-index: 10;
    }
    #controls {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: grid; grid-template-columns: 68px 68px 68px; grid-gap: 12px; z-index: 10;
    }
    .btn {
      width: 68px; height: 68px; background: rgba(255, 255, 255, 0.85);
      border: 3px solid rgba(255, 255, 255, 0.95); border-radius: 18px;
      font-size: 24px; color: #222; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }
    .btn:active { transform: scale(0.92); background: #fff; }
  </style>
</head>
<body>
  <div id="score-board">0</div>
  <div id="canvas-container"></div>
  <div id="controls">
    <div></div><button class="btn" id="btn-up">▲</button><div></div>
    <button class="btn" id="btn-left">◀</button>
    <button class="btn" id="btn-down">▼</button>
    <button class="btn" id="btn-right">▶</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const STEP_SIZE = 20;
    let score = 0;
    let maxLaneReached = 0;
    let isGameOver = false;

    // --- Scene & Camera ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa7d8ff);

    const d = 160;
    const aspect = window.innerWidth / window.innerHeight;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
    camera.position.set(200, 240, 200);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // --- Lights ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(100, 200, 50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- Character (Voxel Chicken) ---
    const chicken = new THREE.Group();
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const beakMat = new THREE.MeshLambertMaterial({ color: 0xff9900 });
    const combMat = new THREE.MeshLambertMaterial({ color: 0xee2222 });
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(12, 14, 12), bodyMat);
    body.position.y = 8;
    chicken.add(body);

    const comb = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 8), combMat);
    comb.position.set(0, 16, 0);
    chicken.add(comb);

    const beak = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 4), beakMat);
    beak.position.set(0, 8, -7);
    chicken.add(beak);

    const eyeL = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), eyeMat);
    eyeL.position.set(4, 10, -6.2);
    const eyeR = eyeL.clone();
    eyeR.position.x = -4;
    chicken.add(eyeL);
    chicken.add(eyeR);

    chicken.position.set(0, 0, 0);
    scene.add(chicken);

    // --- Lanes & Vehicles ---
    const lanes = [];
    const vehicles = [];
    const carColors = [0xe74c3c, 0x3498db, 0xf1c40f, 0x9b59b6];

    function createLane(index) {
      const z = -index * STEP_SIZE;
      const type = index <= 2 ? 'grass' : (Math.random() < 0.65 ? 'road' : 'grass');

      const groundGeo = new THREE.BoxGeometry(1000, 4, STEP_SIZE);
      const groundMat = new THREE.MeshLambertMaterial({ 
        color: type === 'grass' ? 0x76c043 : 0x3e444c 
      });
      const laneMesh = new THREE.Mesh(groundGeo, groundMat);
      laneMesh.position.set(0, -2, z);
      scene.add(laneMesh);

      const laneData = { index, z, type };

      if (type === 'road') {
        laneData.speed = (Math.random() * 1.2 + 0.8) * (Math.random() < 0.5 ? 1 : -1);
        laneData.spawnZ = z;
        laneData.carColor = carColors[Math.floor(Math.random() * carColors.length)];
        spawnCar(laneData, (Math.random() - 0.5) * 300);
      }
      lanes.push(laneData);
    }

    function spawnCar(lane, startX) {
      const car = new THREE.Group();
      const carBody = new THREE.Mesh(
        new THREE.BoxGeometry(24, 10, 14),
        new THREE.MeshLambertMaterial({ color: lane.carColor })
      );
      carBody.position.y = 6;
      car.add(carBody);

      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(14, 7, 12),
        new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })
      );
      cabin.position.set(-2, 13, 0);
      car.add(cabin);

      car.position.set(startX, 0, lane.z);
      car.userData = { lane };
      scene.add(car);
      vehicles.push(car);
    }

    // Generate initial 35 lanes
    for (let i = 0; i < 35; i++) {
      createLane(i);
    }

    // --- Movement & Input ---
    let currentLane = 0;
    let currentX = 0;

    function move(dir) {
      if (isGameOver) return;

      if (dir === 'up') {
        currentLane++;
        chicken.rotation.y = 0;
      } else if (dir === 'down' && currentLane > 0) {
        currentLane--;
        chicken.rotation.y = Math.PI;
      } else if (dir === 'left' && currentX > -140) {
        currentX -= STEP_SIZE;
        chicken.rotation.y = Math.PI / 2;
      } else if (dir === 'right' && currentX < 140) {
        currentX += STEP_SIZE;
        chicken.rotation.y = -Math.PI / 2;
      }

      chicken.position.x = currentX;
      chicken.position.z = -currentLane * STEP_SIZE;

      // Update camera follow
      camera.position.z = chicken.position.z + 200;
      camera.lookAt(0, 0, chicken.position.z);

      // Score tracking
      if (currentLane > maxLaneReached) {
        maxLaneReached = currentLane;
        score = maxLaneReached;
        document.getElementById('score-board').innerText = score;
        createLane(lanes.length); // Procedural extension
      }
    }

    // Touch button events
    document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); move('up'); });
    document.getElementById('btn-down').addEventListener('touchstart', (e) => { e.preventDefault(); move('down'); });
    document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); move('left'); });
    document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); move('right'); });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') move('up');
      if (e.key === 'ArrowDown' || e.key === 's') move('down');
      if (e.key === 'ArrowLeft' || e.key === 'a') move('left');
      if (e.key === 'ArrowRight' || e.key === 'd') move('right');
    });

    // --- Game Loop ---
    function animate() {
      requestAnimationFrame(animate);

      // Move vehicles & test collisions
      for (let i = vehicles.length - 1; i >= 0; i--) {
        const car = vehicles[i];
        car.position.x += car.userData.lane.speed;

        // Wrap around offscreen
        if (car.position.x > 320) car.position.x = -320;
        if (car.position.x < -320) car.position.x = 320;

        // Collision Check (AABB bounding check with chicken)
        if (
          Math.abs(car.position.z - chicken.position.z) < 10 &&
          Math.abs(car.position.x - chicken.position.x) < 16
        ) {
          // Crash reset
          currentLane = 0;
          currentX = 0;
          chicken.position.set(0, 0, 0);
          camera.position.z = 200;
          camera.lookAt(0, 0, 0);
          maxLaneReached = 0;
          score = 0;
          document.getElementById('score-board').innerText = score;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const a = window.innerWidth / window.innerHeight;
      camera.left = -d * a;
      camera.right = d * a;
      camera.top = d;
      camera.bottom = -d;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
